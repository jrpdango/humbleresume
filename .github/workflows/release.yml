name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable semver version to release, without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "workflow_dispatch version must be stable semver in the form 1.2.3" >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the form v1.2.3" >&2
              exit 1
            fi
            version="${tag#v}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or find GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v$VERSION"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "HumbleResume $tag" \
                --generate-notes
            else
              gh release create "$tag" \
                --verify-tag \
                --title "HumbleResume $tag" \
                --generate-notes
            fi
          fi

          release_id="$(gh release view "$tag" --json databaseId --jq '.databaseId')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libappindicator3-dev \
            libfuse2 \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node -e "require('node:fs').writeFileSync('src-tauri/ci-release.json',
          JSON.stringify({ version: process.env.APP_VERSION }))"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        with:
          tauriScript: pnpm exec tauri
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/ci-release.json --no-sign
          releaseAssetNamePattern: HumbleResume-[version]-[platform]-[arch]-[bundle][ext]
